spring.application.name=microlib

spring.datasource.url=jdbc:mysql://localhost:3306/db_prestamo?useSSL=false&serverTimezone=UTC
server.port=8083
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true

# ✅ Activar perfil "dev" para que DataLoader inserte préstamos falsos al arrancar
# IMPORTANTE: libro_ms (8081) y usuario_ms (8082) deben estar corriendo primero
spring.profiles.active=dev

# ✅ Swagger UI disponible en: http://localhost:8083/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
